# CI: the same three gates a developer runs locally, in the same order.
#
#   check  = lint + typecheck + vitest   (fails fast, no browser needed)
#   build  = the production compile      (catches Server/Client boundary errors)
#   e2e    = Playwright over demo mode   (catches what jsdom cannot — see
#                                         playwright.config.ts)
#
# Demo mode means CI needs no backend, no database, and no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
